name: docs

# Build the MkDocs site and publish it to GitHub Pages.
# Repo settings -> Pages -> Source must be set to "GitHub Actions" once.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      # The same content checks ci.yml runs. Without them this workflow could
      # publish a site that ci.yml is failing on: both trigger on push to main
      # and neither waits for the other.
      - name: Lesson numbers match the nav
        run: uv run python scripts/sync_numbering.py --check
      - name: Relative links resolve
        run: uv run python scripts/check_links.py
      - name: Complete units meet the template
        run: uv run python scripts/check_lesson_template.py
      - name: Lesson numbers in prose are not stale
        run: uv run python scripts/check_lesson_refs.py
      - name: Rationed sentence patterns did not go up
        run: uv run python scripts/check_writing.py
      - name: Progress helper behaves
        run: node scripts/test_progress.js
      - name: Build
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
