name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Lesson numbers match the nav
        run: uv run python scripts/sync_numbering.py --check
      - name: Relative links resolve
        run: uv run python scripts/check_links.py
      - name: Complete units meet the template
        run: uv run python scripts/check_lesson_template.py
      - name: Lesson numbers in prose are not stale
        run: uv run python scripts/check_lesson_refs.py
      - name: Rationed sentence patterns did not go up
        run: uv run python scripts/check_writing.py
      - name: Progress helper behaves
        run: node scripts/test_progress.js
      - name: Docs site builds
        run: uv run mkdocs build --strict
