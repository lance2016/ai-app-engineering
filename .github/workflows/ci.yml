name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiapp
          POSTGRES_PASSWORD: aiapp
          POSTGRES_DB: aiapp
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aiapp -d aiapp" --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      MODEL_PROVIDER: fake
      DATABASE_URL: postgresql+asyncpg://aiapp:aiapp@localhost:5432/aiapp
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Relative links resolve
        run: uv run python scripts/check_links.py
      - name: Complete units meet the template
        run: uv run python scripts/check_lesson_template.py
      - name: Status tables match frontmatter
        run: uv run python scripts/sync_status.py --check
      - name: Migrations apply, roll back and re-apply
        run: |
          uv run alembic -c project/src/aiapp/storage/alembic.ini upgrade head
          uv run alembic -c project/src/aiapp/storage/alembic.ini downgrade base
          uv run alembic -c project/src/aiapp/storage/alembic.ini upgrade head
      - name: Every code sample runs offline and the project tests pass on real backends
        run: uv run pytest -q
      - name: Evaluation gate (tasks, tool selection, retrieval, judge calibration vs baseline)
        run: uv run python scripts/eval_run.py --report eval-report.md
      - name: Chaos drills behave as designed
        run: uv run python scripts/chaos.py --all
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t aiapp:ci .
      - name: Container starts, serves /healthz, refuses default tokens in production
        run: |
          set -e
          docker run -d --name aiapp -p 8000:8000 -e AIAPP_ENV=development -e MODEL_PROVIDER=fake aiapp:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/healthz && break || sleep 1; done
          curl -sf localhost:8000/healthz
          docker rm -f aiapp
          if docker run --rm -e AIAPP_ENV=production -e MODEL_PROVIDER=fake aiapp:ci 2>&1 | grep -q "refusing to start in production"; then
            echo "production guard works"; else echo "production guard missing"; exit 1; fi
