name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Relative links resolve
        run: uv run python scripts/check_links.py
      - name: Complete units meet the template
        run: uv run python scripts/check_lesson_template.py
      - name: Status tables match frontmatter
        run: uv run python scripts/sync_status.py --check
      - name: Every code sample runs offline
        run: uv run pytest -q
