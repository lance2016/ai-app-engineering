[project]
name = "ai-app-engineering"
version = "0.0.1"
description = "AI application engineering course: from calling an LLM to shipping an agent system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project/src/aiapp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
prereq = [
    "sqlalchemy>=2.0.52",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
