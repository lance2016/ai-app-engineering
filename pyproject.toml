[project]
name = "ai-app-engineering"
version = "0.0.1"
description = "AI application engineering course: from calling an LLM to shipping an agent system"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "pydantic>=2.7",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project/src/aiapp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]
prereq = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
