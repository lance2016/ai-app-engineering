# Production-shaped stack: the app image, PostgreSQL (pgvector), Redis, Phoenix for traces.
# Secrets come from the environment (or a .env file you keep out of git). Nothing is baked into the image.
#   AIAPP_TOKENS=tok1:tenant-a docker compose -f docker-compose.prod.yml up --build
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      AIAPP_ENV: production
      AIAPP_TOKENS: ${AIAPP_TOKENS:?set AIAPP_TOKENS=token:tenant,... (never the dev default)}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      DATABASE_URL: postgresql+asyncpg://aiapp:aiapp@postgres:5432/aiapp
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      AIAPP_RATE_LIMIT_RPS: ${AIAPP_RATE_LIMIT_RPS:-5}
      AIAPP_DAILY_BUDGET_USD: ${AIAPP_DAILY_BUDGET_USD:-}
      AIAPP_FALLBACK_PROVIDER: ${AIAPP_FALLBACK_PROVIDER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic -c project/src/aiapp/storage/alembic.ini upgrade head &&
             uvicorn aiapp.api.app:create_app --factory --host 0.0.0.0 --port 8000"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiapp
      POSTGRES_PASSWORD: aiapp
      POSTGRES_DB: aiapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiapp -d aiapp"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

volumes:
  postgres-data:
