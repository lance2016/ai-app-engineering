site_name: AI Application Engineering
site_description: 从模型调用，到生产级 Agent 系统 —— 面向开发者的中文开源系统课程
site_url: https://lance2016.github.io/ai-app-engineering/
repo_url: https://github.com/lance2016/ai-app-engineering
repo_name: lance2016/ai-app-engineering
edit_uri: edit/main/
copyright: 文档 CC BY-NC-SA 4.0 · 代码 MIT

docs_dir: docs
site_dir: site

# docs/ 下的内容目录都是指向仓库根目录的符号链接，源文件只有一份。
exclude_docs: |
  **/__pycache__/

theme:
  name: material
  language: zh
  # Roboto is Material's signature and its Google Fonts request stalls for
  # readers in mainland China. The skin uses system faces instead.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer      # 页脚上一课 / 下一课
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色

extra:
  # 44 篇 complete、7 篇 draft（前置组里的六篇加那一组的索引页），0 篇 outline。只标未完成的，见 wabi.css。
  status:
    draft: 草稿，内容还会变
    outline: 只有提纲

extra_css:
  - stylesheets/wabi.css
  # 首页是浏览页，和 lesson 的沉浸阅读版式是两种角色，样式单独一份。
  - stylesheets/home.css

extra_javascript:
  # 学习进度存在读者自己的浏览器里，没有账号也没有后端。
  - javascripts/progress.js

plugins:
  # 装了 jieba 之后，Material 会在构建期对中文正文分词，搜索才能命中中文词。
  - search:
      separator: '[\s​\-,，。？！；：、（）《》]+'
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # MkDocs 默认会把中文标题的锚点整段丢掉，站内所有 #中文锚点 都会断。
      # 换成保留 Unicode 的 slugify，锚点与 GitHub 渲染保持一致。
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
  # 侧栏标签只放名词，短到能一眼扫过；完整标题在页面里。
  - 课程总览: lessons/README.md
  - 能力自测: reference/diagnostic.md
  - 主线课程:
      - "Part 0 起步":
          - 00 起步: lessons/00-setup/README.md
      - "Part 1 模型与上下文":
          - 01 模型选型与成本: lessons/01-how-llms-work/README.md
          - 02 调用、结构化输出与流式: lessons/02-model-api-structured-output-streaming/README.md
          - 03 Prompt Engineering: lessons/03-prompt-engineering/README.md
          - 04 Embedding 与向量检索: lessons/04-embeddings-and-vector-search/README.md
      - "Part 2 Tool 与 Agent":
          - 05 Tool Calling: lessons/05-tool-calling/README.md
          - 06 Agent 循环与控制流: lessons/06-agent-loop/README.md
          - 07 Agent State 与 Runtime: lessons/07-agent-state-and-runtime/README.md
          - 08 Context Engineering: lessons/08-context-engineering-for-agents/README.md
          - 09 Workflow 还是 Agent: lessons/09-workflow-vs-agent/README.md
          - 10 多智能体与 Handoff: lessons/10-multi-agent-handoff/README.md
          - 11 MCP: lessons/11-mcp/README.md
          - 12 Skill 与能力分层: lessons/12-skills-and-capability-layers/README.md
          - 13 Agent Harness: lessons/13-agent-harness/README.md
      - "Part 3 知识与记忆":
          - 14 RAG 端到端: lessons/14-rag-end-to-end/README.md
          - 15 Memory: lessons/15-memory/README.md
          - 16 数据工程: lessons/16-data-engineering/README.md
      - "Part 4 生产工程":
          - 17 系统架构与数据流: lessons/17-system-architecture/README.md
          - 18 评测: lessons/18-evaluation/README.md
          - 19 可观测性: lessons/19-observability/README.md
          - 20 可靠性与成本: lessons/20-reliability-cost-llmops/README.md
          - 21 安全与治理: lessons/21-security-governance/README.md
          - 22 微调与推理服务: lessons/22-model-adaptation-finetuning-inference/README.md
      - "Part 5 产品与技术决策":
          - 23 产品设计与交互: lessons/23-product-design-ux/README.md
          - 24 语音应用: lessons/24-voice-agents/README.md
          - 25 系统设计与技术决策: lessons/25-system-design-decisions/README.md
  # 两类都不是必修，只在需要时才查，所以排在主线之后。分类留着，以后各自还会加内容。
  - 补充基础:
      - 概述: prerequisites/README.md
      - 工程能力:
          - 编程与后端底子: prerequisites/engineering-foundations.md
      - 算法基础:
          - 算法与数学底子: prerequisites/algorithm-foundations.md
          - F00 LLM 是什么: prerequisites/llm-foundations/00-what-an-llm-is/README.md
          - F01 Tokenization: prerequisites/llm-foundations/01-tokenization/README.md
          - F02 Embedding 与向量空间: prerequisites/llm-foundations/02-embeddings/README.md
          - F03 Attention 与 Transformer: prerequisites/llm-foundations/03-attention-and-transformer/README.md
          - F04 Context Window 与 Sampling: prerequisites/llm-foundations/04-context-window-and-sampling/README.md
          - F05 训练与对齐: prerequisites/llm-foundations/05-training-and-alignment/README.md
          - F06 KV Cache 与推理: prerequisites/llm-foundations/06-kv-cache-and-inference/README.md
          - F07 模型地图: prerequisites/llm-foundations/07-model-landscape/README.md
  - 工程原则:
      - 概述: principles/README.md
      - 01 模型输出是建议: principles/01-model-output-is-a-suggestion.md
      - 02 默认用确定性 Workflow: principles/02-deterministic-by-default.md
      - 03 自己掌控 Prompt 与 Context: principles/03-own-your-prompts-and-context.md
      - 04 Tool 是带契约的输出: principles/04-tools-are-contracts.md
      - 05 状态由运行时持有: principles/05-runtime-owns-state.md
      - 06 副作用幂等、可确认、可审计: principles/06-side-effects-are-idempotent-and-auditable.md
      - 07 失败要分层定位: principles/07-locate-failures-by-layer.md
      - 08 没有评测就没有「变好了」: principles/08-no-eval-no-improvement.md
      - 09 Trace 是一等公民: principles/09-trace-is-first-class.md
      - 10 成本和延迟是设计约束: principles/10-cost-and-latency-are-design-constraints.md
      - 11 安全边界由代码执行: principles/11-guardrails-in-code-not-prompts.md
      - 12 模型是可替换的适配器: principles/12-models-are-swappable-adapters.md
  - 参考手册:
      - 框架一览: reference/frameworks.md
      - 术语表: reference/glossary.md
      - 技术选型: reference/stack.md
      - 外部资料: reference/resources.md
