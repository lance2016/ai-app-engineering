      - F01 Tokenization: prerequisites/llm-foundations/01-tokenization/README.md
      - F02 Embedding 与向量空间: prerequisites/llm-foundations/02-embeddings/README.md
      - F03 Attention 与 Transformer: prerequisites/llm-foundations/03-attention-and-transformer/README.md
      - F04 Context Window 与 Sampling: prerequisites/llm-foundations/04-context-window-and-sampling/README.md
      - F05 训练与对齐: prerequisites/llm-foundations/05-training-and-alignment/README.md
      - F06 KV Cache 与推理: prerequisites/llm-foundations/06-kv-cache-and-inference/README.md
      - F07 模型地图: prerequisites/llm-foundations/07-model-landscape/README.md
  - 工程原则:
      - 12 条 AI 应用工程原则: principles/README.md
      - 原则 01｜模型输出是建议，不是执行结果: principles/01-model-output-is-a-suggestion.md
      - 原则 02｜默认用确定性 Workflow: principles/02-deterministic-by-default.md
      - 原则 03｜Prompt 和 Context Window 必须自己掌控: principles/03-own-your-prompts-and-context.md
      - 原则 04｜Tool 就是带契约的结构化输出: principles/04-tools-are-contracts.md
      - 原则 05｜状态由运行时持有: principles/05-runtime-owns-state.md
      - 原则 06｜每个副作用都要幂等、可确认、可审计: principles/06-side-effects-are-idempotent-and-auditable.md
      - 原则 07｜失败要分层定位: principles/07-locate-failures-by-layer.md
      - 原则 08｜没有评测集，就没有「变好了」: principles/08-no-eval-no-improvement.md
      - 原则 09｜Trace 是一等公民: principles/09-trace-is-first-class.md
      - 原则 10｜成本和延迟是设计约束: principles/10-cost-and-latency-are-design-constraints.md
      - 原则 11｜安全边界由确定性代码执行: principles/11-guardrails-in-code-not-prompts.md
      - 原则 12｜模型是可替换的适配器: principles/12-models-are-swappable-adapters.md
  - 查阅:
