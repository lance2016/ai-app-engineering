site_name: AI Application Engineering
site_description: 从模型调用，到生产级 Agent 系统 —— 面向开发者的中文开源系统课程
site_url: https://lance2016.github.io/ai-app-engineering/
repo_url: https://github.com/lance2016/ai-app-engineering
repo_name: lance2016/ai-app-engineering
edit_uri: edit/main/
copyright: 文档 CC BY-NC-SA 4.0 · 代码 MIT

docs_dir: docs
site_dir: site

# docs/ 下的内容目录都是指向仓库根目录的符号链接，源文件只有一份。
exclude_docs: |
  **/__pycache__/

theme:
  name: material
  language: zh
  # Roboto is Material's signature and its Google Fonts request stalls for
  # readers in mainland China. The skin uses system faces instead.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer      # 页脚上一课 / 下一课
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色

extra:
  # 40 篇 complete、9 篇 draft（前置那一组），0 篇 outline。只标未完成的，见 wabi.css。
  status:
    draft: 草稿，内容还会变
    outline: 只有提纲

extra_css:
  - stylesheets/wabi.css

plugins:
  # 装了 jieba 之后，Material 会在构建期对中文正文分词，搜索才能命中中文词。
  - search:
      separator: '[\s​\-,，。？！；：、（）《》]+'
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # MkDocs 默认会把中文标题的锚点整段丢掉，站内所有 #中文锚点 都会断。
      # 换成保留 Unicode 的 slugify，锚点与 GitHub 渲染保持一致。
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
  - 主线课程:
      - 课程总览：每个 Part 在搭什么: lessons/README.md
      - "Part 0 起步":
          - 00 起步：怎么读这门课，怎么接第一个模型: lessons/00-setup/README.md
      - "Part 1 模型与上下文":
          - 01 从模型到应用：能力边界、成本模型与选型: lessons/01-how-llms-work/README.md
          - 02 模型调用、结构化输出与流式: lessons/02-model-api-structured-output-streaming/README.md
          - 03 Prompt Engineering 与单次调用的上下文: lessons/03-prompt-engineering/README.md
          - 04 Embedding 与向量检索基础: lessons/04-embeddings-and-vector-search/README.md
      - "Part 2 Tool 与 Agent":
          - 05 Tool Calling：从 Schema 到副作用: lessons/05-tool-calling/README.md
          - 06 Agent 循环与控制流: lessons/06-agent-loop/README.md
          - 07 Agent State 与 Runtime: lessons/07-agent-state-and-runtime/README.md
          - 08 Agent 的 Context Engineering: lessons/08-context-engineering-for-agents/README.md
          - 09 Workflow 还是 Agent：架构模式: lessons/09-workflow-vs-agent/README.md
          - 10 多智能体、Handoff 与 Racing: lessons/10-multi-agent-handoff/README.md
          - 11 MCP：模型上下文协议: lessons/11-mcp/README.md
          - 12 Skill 与能力生态分层: lessons/12-skills-and-capability-layers/README.md
      - "Part 3 知识与记忆":
          - 13 RAG 端到端: lessons/13-rag-end-to-end/README.md
          - 14 Memory：提取、整合与检索: lessons/14-memory/README.md
          - 15 数据工程与数据质量: lessons/15-data-engineering/README.md
      - "Part 4 生产工程":
          - 16 AI 应用系统架构与端到端数据流: lessons/16-system-architecture/README.md
          - 17 评测：Golden Set、LLM Judge 与 Agent Eval: lessons/17-evaluation/README.md
          - 18 可观测性：从日志到 LLM Trace: lessons/18-observability/README.md
          - 19 可靠性、成本、部署与 LLMOps: lessons/19-reliability-cost-llmops/README.md
          - 20 安全与治理: lessons/20-security-governance/README.md
          - 21 模型适配、微调与推理服务: lessons/21-model-adaptation-finetuning-inference/README.md
      - "Part 5 架构与产品":
