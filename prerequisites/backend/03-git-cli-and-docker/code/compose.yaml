# Start PostgreSQL (with pgvector) and Redis for the course project:
#   docker compose -f prerequisites/python/11-git-cli-and-docker/code/compose.yaml up -d
# Stop and keep data:      docker compose ... down
# Stop and wipe data:      docker compose ... down -v
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
