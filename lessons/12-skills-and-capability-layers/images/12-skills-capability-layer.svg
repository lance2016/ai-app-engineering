<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>CAPABILITY LAYER</title><desc>按需加载能力，让上下文保持小，让权限保持可见</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">12 · CAPABILITY LAYER</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">按需加载能力，让上下文保持小，让权限保持可见</text>
<g><rect x="70" y="280" width="190" height="100" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="88" y="314" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Task</text>
<text x="88" y="344" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">needs capability</text></g><line x1="260" y1="330" x2="385" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="385" y="225" width="250" height="70" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="403" y="259" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Discover</text>
<text x="403" y="289" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">metadata + trigger</text></g><line x1="510" y1="295" x2="510" y2="325" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="385" y="325" width="250" height="70" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="403" y="359" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Load</text>
<text x="403" y="389" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">instructions + examples</text></g><line x1="510" y1="395" x2="510" y2="425" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="385" y="425" width="250" height="70" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="403" y="459" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Execute</text>
<text x="403" y="489" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">tools + policy</text></g><line x1="635" y1="460" x2="790" y2="460" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="790" y="415" width="260" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="808" y="449" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Result</text>
<text x="808" y="479" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">then unload</text></g><text x="825" y="285" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">inactive skills stay out</text><line x1="385" y1="460" x2="295" y2="460" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="110" y="500" fill="#ff5f7a" font-size="17" font-family="Arial, sans-serif">blocked by policy</text>
</svg>
