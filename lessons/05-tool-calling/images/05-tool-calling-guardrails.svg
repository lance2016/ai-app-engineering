<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>TOOL CALLING</title><desc>模型只能提出意图，运行时负责验证、授权、审批和幂等</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">05 · TOOL CALLING</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">模型只能提出意图，运行时负责验证、授权、审批和幂等</text>
<g><rect x="50" y="285" width="150" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="68" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Model</text>
<text x="68" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">tool intent</text></g><line x1="200" y1="330" x2="300" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="300" y="285" width="145" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="318" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Schema</text>
<text x="318" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">valid shape</text></g><line x1="445" y1="330" x2="545" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="545" y="285" width="145" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="563" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Policy</text>
<text x="563" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">allowlist</text></g><line x1="690" y1="330" x2="790" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="790" y="285" width="145" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="808" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Approval</text>
<text x="808" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">human gate</text></g><line x1="935" y1="330" x2="1035" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1035" y="285" width="145" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="1053" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Execute</text>
<text x="1053" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">idempotent</text></g><line x1="615" y1="375" x2="615" y2="495" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="540" y="535" fill="#ff5f7a" font-size="17" font-family="Arial, sans-serif">deny / audit</text><text x="52" y="455" fill="#9fb3ce" font-size="18" font-family="Arial, sans-serif">Control flow belongs to the runtime, not the prompt</text>
</svg>
