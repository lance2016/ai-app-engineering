<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>MCP BOUNDARY</title><desc>协议把 Host 与外部能力解耦，但超时、权限和版本仍需治理</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">11 · MCP BOUNDARY</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">协议把 Host 与外部能力解耦，但超时、权限和版本仍需治理</text>
<g><rect x="55" y="280" width="180" height="100" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="73" y="314" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Agent Host</text>
<text x="73" y="344" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">discover + call</text></g><line x1="235" y1="330" x2="380" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="380" y="260" width="200" height="140" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="398" y="294" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">MCP transport</text>
<text x="398" y="324" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">stable protocol</text></g><line x1="580" y1="300" x2="730" y2="210" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="580" y1="350" x2="730" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="580" y1="385" x2="730" y2="450" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="730" y="160" width="260" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="748" y="194" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Tools</text>
<text x="748" y="224" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">actions</text></g><g><rect x="730" y="285" width="260" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="748" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Resources</text>
<text x="748" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">read context</text></g><g><rect x="730" y="410" width="260" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="748" y="444" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Prompts</text>
<text x="748" y="474" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">templates</text></g><line x1="580" y1="400" x2="580" y2="525" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="500" y="565" fill="#ff5f7a" font-size="17" font-family="Arial, sans-serif">timeout / auth / version mismatch</text>
</svg>
