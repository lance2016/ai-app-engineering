<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>RELIABILITY CONTROL</title><desc>限额、熔断、重试和 fallback 共同决定降级时还能否安全返回</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">19 · RELIABILITY CONTROL</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">限额、熔断、重试和 fallback 共同决定降级时还能否安全返回</text>
<g><rect x="40" y="295" width="125" height="82" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="58" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Request</text>
<text x="58" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">incoming</text></g><line x1="165" y1="336" x2="245" y2="336" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="245" y="295" width="125" height="82" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="263" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Budget</text>
<text x="263" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">cost / time</text></g><line x1="370" y1="336" x2="450" y2="336" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="450" y="295" width="125" height="82" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="468" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Rate limit</text>
<text x="468" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">admit</text></g><line x1="575" y1="336" x2="655" y2="336" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="655" y="295" width="125" height="82" rx="14" fill="#0d2343" stroke="#ff5f7a" stroke-width="2"/>
<text x="673" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Breaker</text>
<text x="673" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">trip</text></g><line x1="780" y1="336" x2="860" y2="336" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="860" y="295" width="125" height="82" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="878" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Retry</text>
<text x="878" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">bounded</text></g><line x1="985" y1="336" x2="1065" y2="336" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1065" y="295" width="125" height="82" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="1083" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Fallback</text>
<text x="1083" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">safe answer</text></g><line x1="720" y1="377" x2="720" y2="500" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><line x1="720" y1="500" x2="1060" y2="500" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="820" y="545" fill="#ff5f7a" font-size="18" font-family="Arial, sans-serif">degrade, do not amplify failure</text>
</svg>
