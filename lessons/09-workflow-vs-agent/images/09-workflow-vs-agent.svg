<text x="318" y="239" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Step B</text>
<text x="318" y="269" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">fixed</text></g><line x1="445" y1="245" x2="540" y2="245" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="540" y="205" width="145" height="80" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="558" y="239" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Step C</text>
<text x="558" y="269" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">fixed</text></g><text x="65" y="360" fill="#9c7bff" font-size="20" font-family="Arial, sans-serif">BOUNDED AGENT</text><g><rect x="60" y="415" width="145" height="80" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="78" y="449" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Observe</text>
<text x="78" y="479" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">state</text></g><line x1="205" y1="455" x2="300" y2="455" stroke="#9c7bff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="300" y="415" width="145" height="80" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="318" y="449" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Choose</text>
<text x="318" y="479" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">bounded tools</text></g><line x1="445" y1="455" x2="540" y2="455" stroke="#9c7bff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="540" y="415" width="145" height="80" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="558" y="449" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Verify</text>
<text x="558" y="479" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">stop</text></g><text x="760" y="250" fill="#63e6be" font-size="19" font-family="Arial, sans-serif">Known route</text><text x="760" y="455" fill="#9c7bff" font-size="19" font-family="Arial, sans-serif">Adaptive route</text><text x="60" y="575" fill="#ffbb66" font-size="18" font-family="Arial, sans-serif">More autonomy → more evaluation, limits and observability</text>
