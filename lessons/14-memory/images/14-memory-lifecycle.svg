<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>MEMORY LIFECYCLE</title><desc>记忆不是聊天记录：它要被提取、验证、召回和删除</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">14 · MEMORY LIFECYCLE</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">记忆不是聊天记录：它要被提取、验证、召回和删除</text>
<g><rect x="55" y="285" width="160" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="73" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Conversation</text>
<text x="73" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">raw events</text></g><line x1="215" y1="330" x2="320" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="320" y="285" width="160" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="338" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Extract</text>
<text x="338" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">candidate</text></g><line x1="480" y1="330" x2="585" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="585" y="285" width="160" height="90" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="603" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Consolidate</text>
<text x="603" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">durable</text></g><line x1="745" y1="330" x2="850" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="850" y="285" width="160" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="868" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Retrieve</text>
<text x="868" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">future task</text></g><line x1="1010" y1="330" x2="1115" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1115" y="285" width="70" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="1133" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Use</text>
<text x="1133" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">context</text></g><line x1="665" y1="375" x2="665" y2="500" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><line x1="665" y1="500" x2="585" y2="500" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="475" y="545" fill="#ff5f7a" font-size="18" font-family="Arial, sans-serif">forget / correct / delete</text><text x="55" y="475" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">durable memory needs ownership and provenance</text>
</svg>
