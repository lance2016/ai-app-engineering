<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>AGENT LOOP</title><desc>循环必须有可观察的停止条件，而不是让模型无限自转</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">06 · AGENT LOOP</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">循环必须有可观察的停止条件，而不是让模型无限自转</text>
<g><rect x="120" y="270" width="170" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="138" y="304" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Observe</text>
<text x="138" y="334" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">state + tools</text></g><line x1="290" y1="315" x2="405" y2="315" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="405" y="270" width="170" height="90" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="423" y="304" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Decide</text>
<text x="423" y="334" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">next action</text></g><line x1="575" y1="315" x2="690" y2="315" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="690" y="270" width="170" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="708" y="304" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Act</text>
<text x="708" y="334" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">tool / answer</text></g><line x1="775" y1="360" x2="775" y2="455" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="690" y="455" width="170" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="708" y="489" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Verify</text>
<text x="708" y="519" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">goal reached?</text></g><line x1="690" y1="500" x2="575" y2="500" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="405" y1="500" x2="290" y2="360" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="405" y1="360" x2="405" y2="500" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="350" y="570" fill="#ff5f7a" font-size="18" font-family="Arial, sans-serif">budget / timeout / max steps</text><text x="890" y="300" fill="#63e6be" font-size="18" font-family="Arial, sans-serif">stop</text>
</svg>
