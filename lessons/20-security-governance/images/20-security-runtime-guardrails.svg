<text x="328" y="309" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Sanitize</text>
<text x="328" y="339" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">redact + mark</text></g><line x1="475" y1="340" x2="585" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="585" y="275" width="165" height="130" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="603" y="309" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Policy</text>
<text x="603" y="339" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">trust boundary</text></g><line x1="750" y1="340" x2="860" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="860" y="275" width="165" height="130" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="878" y="309" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Model</text>
<text x="878" y="339" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">propose only</text></g><line x1="1025" y1="340" x2="1135" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1135" y="295" width="55" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="1153" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Tool</text>
<text x="1153" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">gate</text></g><line x1="665" y1="405" x2="665" y2="500" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><g><rect x="570" y="500" width="190" height="70" rx="14" fill="#0d2343" stroke="#ff5f7a" stroke-width="2"/>
<text x="588" y="534" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Deny + audit</text>
<text x="588" y="564" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">blocked path</text></g><text x="55" y="475" fill="#ff5f7a" font-size="18" font-family="Arial, sans-serif">data plane is not control plane</text>
