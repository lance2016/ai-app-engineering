</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">20 · SECURITY BOUNDARY</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">不可信内容可以进入上下文，但不能直接获得工具权限</text>
<g><rect x="45" y="295" width="155" height="90" rx="14" fill="#0d2343" stroke="#ff5f7a" stroke-width="2"/>
<text x="63" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">User / RAG</text>
