<text x="78" y="324" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">same application API</text></g><line x1="250" y1="305" x2="400" y2="305" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="400" y="245" width="220" height="120" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="418" y="279" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Adapter</text>
<text x="418" y="309" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">stable boundary</text></g><line x1="620" y1="280" x2="790" y2="205" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="620" y1="330" x2="790" y2="405" stroke="#9c7bff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="790" y="150" width="270" height="110" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="808" y="184" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Fake replay</text>
<text x="808" y="214" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">deterministic · offline</text></g><g><rect x="790" y="350" width="270" height="110" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="808" y="384" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Cloud model</text>
<text x="808" y="414" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">replaceable backend</text></g><text x="430" y="430" fill="#ffbb66" font-size="18" font-family="Arial, sans-serif">Tests and lessons stay reproducible</text>
