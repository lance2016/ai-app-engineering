</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">00 · MODEL ADAPTER</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">同一个调用接口，后端可以切换为离线回放或真实模型</text>
