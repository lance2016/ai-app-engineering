<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>EVALUATION GATE</title><desc>评测不是一次打分，而是把失败变成下一次发布的回归用例</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">17 · EVALUATION GATE</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">评测不是一次打分，而是把失败变成下一次发布的回归用例</text>
<g><rect x="50" y="295" width="165" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="68" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Golden set</text>
<text x="68" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">cases</text></g><line x1="215" y1="340" x2="330" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="330" y="295" width="165" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="348" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Run</text>
<text x="348" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">answer + trace</text></g><line x1="495" y1="340" x2="610" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="610" y="230" width="165" height="90" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="628" y="264" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Metrics</text>
<text x="628" y="294" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">quality</text></g><g><rect x="610" y="390" width="165" height="90" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="628" y="424" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Judge</text>
<text x="628" y="454" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">rubric</text></g><line x1="775" y1="275" x2="880" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="775" y1="435" x2="880" y2="360" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="880" y="295" width="145" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="898" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Gate</text>
<text x="898" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">pass / fail</text></g><line x1="1025" y1="340" x2="1125" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1125" y="295" width="70" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="1143" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Ship</text>
<text x="1143" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">release</text></g><line x1="950" y1="390" x2="950" y2="510" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><line x1="950" y1="510" x2="150" y2="510" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="430" y="550" fill="#ff5f7a" font-size="18" font-family="Arial, sans-serif">failed case → regression set</text>
</svg>
