<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>STATE AND RESUME</title><desc>checkpoint 把一次长流程变成可暂停、可恢复的状态机</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">07 · STATE AND RESUME</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">checkpoint 把一次长流程变成可暂停、可恢复的状态机</text>
<g><rect x="50" y="295" width="155" height="82" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="68" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Event</text>
<text x="68" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">append-only</text></g><line x1="205" y1="336" x2="315" y2="336" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="315" y="270" width="190" height="130" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="333" y="304" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Runtime</text>
<text x="333" y="334" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">transition</text></g><line x1="505" y1="320" x2="625" y2="320" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="625" y="270" width="190" height="130" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="643" y="304" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Checkpoint</text>
<text x="643" y="334" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">state snapshot</text></g><line x1="815" y1="320" x2="955" y2="220" stroke="#ffbb66" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="955" y="165" width="190" height="100" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="973" y="199" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Pause</text>
<text x="973" y="229" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">approval</text></g><line x1="1050" y1="265" x2="1050" y2="430" stroke="#ffbb66" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><g><rect x="955" y="430" width="190" height="100" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="973" y="464" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Resume</text>
<text x="973" y="494" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">from snapshot</text></g><line x1="955" y1="480" x2="815" y2="385" stroke="#63e6be" stroke-width="4" marker-end="url(#arrow)" /><text x="330" y="480" fill="#9fb3ce" font-size="18" font-family="Arial, sans-serif">restart reads state, not history</text>
</svg>
