<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>CAPABILITY BOUNDARY</title><desc>模型擅长生成与归纳，但事实、权限和副作用要交给系统</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">01 · CAPABILITY BOUNDARY</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">模型擅长生成与归纳，但事实、权限和副作用要交给系统</text>
<g><rect x="60" y="280" width="170" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="78" y="314" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Input</text>
<text x="78" y="344" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">request + context</text></g><line x1="230" y1="325" x2="370" y2="325" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="370" y="250" width="210" height="150" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="388" y="284" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Model</text>
<text x="388" y="314" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">probabilistic output</text></g><line x1="580" y1="290" x2="730" y2="200" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="580" y1="350" x2="730" y2="450" stroke="#ffbb66" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="730" y="145" width="280" height="110" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="748" y="179" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Answer directly</text>
<text x="748" y="209" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">low-risk generation</text></g><g><rect x="730" y="395" width="280" height="110" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="748" y="429" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Tool / policy gate</text>
<text x="748" y="459" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">facts · auth · side effects</text></g><text x="78" y="500" fill="#ff5f7a" font-size="19" font-family="Arial, sans-serif">Model confidence is not system authority</text>
</svg>
