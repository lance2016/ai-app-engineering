<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>PROMPT AS CONTRACT</title><desc>上下文区块要有类型、顺序和边界，避免数据伪装成指令</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">03 · PROMPT AS CONTRACT</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">上下文区块要有类型、顺序和边界，避免数据伪装成指令</text>
<g><rect x="60" y="145" width="230" height="82" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="78" y="179" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Policy</text>
<text x="78" y="209" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">stable rules</text></g><g><rect x="60" y="260" width="230" height="82" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="78" y="294" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">User request</text>
<text x="78" y="324" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">task intent</text></g><g><rect x="60" y="375" width="230" height="82" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="78" y="409" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Evidence</text>
<text x="78" y="439" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">untrusted data</text></g><g><rect x="60" y="490" width="230" height="82" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="78" y="524" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Output contract</text>
<text x="78" y="554" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">shape + limits</text></g><line x1="290" y1="186" x2="470" y2="315" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="290" y1="301" x2="470" y2="325" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="290" y1="416" x2="470" y2="340" stroke="#ffbb66" stroke-width="4" marker-end="url(#arrow)" /><line x1="290" y1="531" x2="470" y2="350" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="470" y="250" width="270" height="140" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="488" y="284" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Context window</text>
<text x="488" y="314" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">ordered sections</text></g><line x1="740" y1="320" x2="900" y2="320" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="900" y="275" width="230" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="918" y="309" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Model output</text>
<text x="918" y="339" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">validated result</text></g><text x="475" y="450" fill="#ff5f7a" font-size="18" font-family="Arial, sans-serif">Boundary between instructions and data</text>
</svg>
