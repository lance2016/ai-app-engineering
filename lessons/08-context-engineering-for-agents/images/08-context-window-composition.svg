<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>CONTEXT WINDOW</title><desc>每一轮只把最有用的状态、工具结果和证据放入有限窗口</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">08 · CONTEXT WINDOW</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">每一轮只把最有用的状态、工具结果和证据放入有限窗口</text>
<g><rect x="55" y="285" width="175" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="73" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Sources</text>
<text x="73" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">state · tools · RAG</text></g><line x1="230" y1="330" x2="350" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="350" y="250" width="185" height="160" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="368" y="284" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Rank + compact</text>
<text x="368" y="314" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">priority order</text></g><line x1="535" y1="330" x2="650" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><rect x="650" y="215" width="320" height="230" rx="16" fill="#0d2343" stroke="#42d9ff" stroke-width="3"/>
  <text x="680" y="250" fill="#42d9ff" font-size="21" font-family="Arial, sans-serif">ACTIVE CONTEXT</text>
  <g><rect x="680" y="275" width="260" height="48" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="698" y="309" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">policy + task</text>
<text x="698" y="339" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif"></text></g>
  <g><rect x="680" y="335" width="260" height="48" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="698" y="369" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">recent tool result</text>
<text x="698" y="399" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif"></text></g>
  <g><rect x="680" y="395" width="260" height="28" rx="14" fill="#0d2343" stroke="#9fb3ce" stroke-width="2"/>
<text x="698" y="429" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">older turns → compacted</text>
<text x="698" y="459" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif"></text></g><line x1="970" y1="330" x2="1085" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1085" y="285" width="100" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="1103" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">LLM</text>
<text x="1103" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">next step</text></g><text x="360" y="500" fill="#ff5f7a" font-size="18" font-family="Arial, sans-serif">overflow is a design decision</text>
</svg>
