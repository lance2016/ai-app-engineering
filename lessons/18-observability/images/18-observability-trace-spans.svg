<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>TRACE SPANS</title><desc>把一次黑盒请求展开为可定位的父子 span</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061329"/><stop offset="1" stop-color="#0a1d3b"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1c3960" stroke-width="1" opacity=".42"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#42d9ff"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
<text x="54" y="54" fill="#eef7ff" font-size="27" font-family="Arial, sans-serif" font-weight="700">18 · TRACE SPANS</text>
<text x="54" y="84" fill="#9fb3ce" font-size="17" font-family="Arial, sans-serif">把一次黑盒请求展开为可定位的父子 span</text>
<g><rect x="50" y="280" width="170" height="100" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="68" y="314" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Root trace</text>
<text x="68" y="344" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">request</text></g><line x1="220" y1="330" x2="340" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="340" y="280" width="170" height="100" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="358" y="314" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Model span</text>
<text x="358" y="344" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">latency + tokens</text></g><line x1="510" y1="305" x2="620" y2="205" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="510" y1="330" x2="620" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><line x1="510" y1="355" x2="620" y2="455" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="620" y="160" width="220" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="638" y="194" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Retrieval span</text>
<text x="638" y="224" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">query + hits</text></g><g><rect x="620" y="285" width="220" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="638" y="319" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Tool span</text>
<text x="638" y="349" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">args + result</text></g><g><rect x="620" y="410" width="220" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="638" y="444" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Approval span</text>
<text x="638" y="474" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">pause + actor</text></g><line x1="840" y1="330" x2="1010" y2="330" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1010" y="280" width="150" height="100" rx="14" fill="#0d2343" stroke="#9fb3ce" stroke-width="2"/>
<text x="1028" y="314" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Collector</text>
<text x="1028" y="344" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">trace + logs</text></g><text x="865" y="455" fill="#ff5f7a" font-size="17" font-family="Arial, sans-serif">error stays attached to its span</text>
</svg>
