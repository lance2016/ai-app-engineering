<text x="63" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">constraint</text></g><line x1="200" y1="340" x2="300" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="300" y="295" width="170" height="90" rx="14" fill="#0d2343" stroke="#42d9ff" stroke-width="2"/>
<text x="318" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Options</text>
<text x="318" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">compare</text></g><line x1="470" y1="340" x2="570" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="570" y="250" width="190" height="180" rx="14" fill="#0d2343" stroke="#9c7bff" stroke-width="2"/>
<text x="588" y="284" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Trade-off</text>
<text x="588" y="314" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">latency · cost
reliability · control</text></g><line x1="760" y1="320" x2="870" y2="320" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="870" y="295" width="145" height="90" rx="14" fill="#0d2343" stroke="#ffbb66" stroke-width="2"/>
<text x="888" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">ADR</text>
<text x="888" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">decision</text></g><line x1="1015" y1="340" x2="1125" y2="340" stroke="#42d9ff" stroke-width="4" marker-end="url(#arrow)" /><g><rect x="1125" y="295" width="65" height="90" rx="14" fill="#0d2343" stroke="#63e6be" stroke-width="2"/>
<text x="1143" y="329" fill="#eef7ff" font-size="22" font-family="Arial, sans-serif" font-weight="700">Ship</text>
<text x="1143" y="359" fill="#9fb3ce" font-size="15" font-family="Arial, sans-serif">verify</text></g><line x1="665" y1="430" x2="665" y2="520" stroke="#ff5f7a" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><g><rect x="570" y="520" width="190" height="70" rx="14" fill="#0d2343" stroke="#ff5f7a" stroke-width="2"/>
