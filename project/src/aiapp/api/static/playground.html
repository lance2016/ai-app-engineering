<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiapp playground</title>
<style>
  :root { --bg:#0f1218; --panel:#161b24; --line:#26303f; --fg:#e6e9ef; --muted:#8b95a7; --accent:#5aa9ff; --ok:#3ecf8e; --warn:#f5b342; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  header label { color:var(--muted); font-size:12px; display:flex; gap:6px; align-items:center; }
  #health { margin-left:auto; color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 1.4fr 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  input, textarea, select { background:#0c0f14; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input { min-width:120px; }
  textarea { width:100%; min-height:64px; resize:vertical; }
  button { background:#1f2a3a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#06101c; border-color:var(--accent); font-weight:600; }
  button.danger { border-color:var(--err); color:var(--err); }
  button:disabled { opacity:.5; cursor:default; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  #events { display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow:auto; padding-right:4px; }
  .ev { border-left:3px solid var(--line); padding:6px 10px; background:#11161f; border-radius:4px; }
  .ev .type { font-size:11px; color:var(--muted); letter-spacing:.03em; }
  .ev pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; font-size:12px; color:#c8d0dc; }
  .ev.assistant { border-color:var(--ok); }
  .ev.tool_call, .ev.tool_result { border-color:var(--accent); }
  .ev.human_input_requested, .ev.human_input { border-color:var(--warn); }
  .ev.run_failed, .ev.error { border-color:var(--err); }
  .ev.run_finished, .ev.citations_checked { border-color:#9d7cff; }
  #pending { border:1px dashed var(--warn); border-radius:6px; padding:10px; margin-top:8px; }
  .status { font-size:12px; color:var(--muted); }
  .status b { color:var(--fg); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .hint { color:var(--muted); font-size:12px; margin:0 0 8px; }
  .hint code { color:var(--fg); }
</style>
</head>
<body>
<header>
  <h1>aiapp playground</h1>
  <label>Token <input id="token" class="mono" value="dev-token" size="14"></label>
  <label>X-User-Id <input id="userId" class="mono" placeholder="(tenant)" size="12"></label>
  <span id="health" class="mono">checking /healthz…</span>
</header>

<main>
  <section>
    <h2>Thread</h2>
    <p class="hint">With <code>MODEL_PROVIDER=fake</code> the model echoes your message. With a real model try:
      <code>search the refund policy and read it</code> · <code>delete doc_returns_draft, reason draft</code> (pauses for your approval).</p>
    <div class="row">
      <button id="newThread" class="primary">New thread</button>
      <input id="threadId" class="mono" placeholder="thread_id" size="24">
      <button id="loadThread">Load</button>
      <span class="status">status: <b id="threadStatus">–</b></span>
    </div>
    <div class="row">
      <textarea id="content" placeholder="Message to the agent"></textarea>
    </div>
    <div class="row">
      <button id="send" class="primary">Send</button>
      <label class="status">allowed_tools <input id="allowedTools" class="mono" placeholder="search_docs,read_doc" size="22"></label>
      <button id="clear">Clear view</button>
    </div>
    <div id="pending" hidden></div>
    <div id="events"></div>
  </section>

  <div style="display:flex; flex-direction:column; gap:12px;">
    <section>
      <h2>Knowledge</h2>
      <div class="row">
        <input id="docId" class="mono" placeholder="doc_id" size="14">
        <input id="docTitle" placeholder="title" size="16">
        <input id="docVersion" class="mono" type="number" value="1" min="1" style="width:70px">
      </div>
      <textarea id="docText" placeholder="Markdown text to ingest"></textarea>
      <div class="row">
        <button id="ingest" class="primary">Ingest</button>
        <button id="listDocs">List documents</button>
      </div>
      <div class="row">
        <input id="q" placeholder="search query" size="24">
        <input id="k" class="mono" type="number" value="5" min="1" max="20" style="width:64px">
        <button id="search">Search</button>
      </div>
      <div id="knowledgeOut"></div>
    </section>

    <section>
      <h2>Memory</h2>
      <div class="row">
        <button id="extract">Extract from current thread</button>
        <button id="listMem">List memories</button>
        <label class="status"><input id="withHistory" type="checkbox"> include history</label>
      </div>
      <div id="memoryOut"></div>
    </section>
  </div>
</main>

<script>
// All calls go to the same origin the page was served from; nothing is proxied or stored.
const $ = (id) => document.getElementById(id);
const state = { threadId: null, streaming: false };

function headers(extra = {}) {
  const h = { "Authorization": `Bearer ${$("token").value.trim()}`, "Content-Type": "application/json", ...extra };
  const user = $("userId").value.trim();
  if (user) h["X-User-Id"] = user;
  return h;
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: headers(), body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) throw Object.assign(new Error(`${res.status} ${path}`), { data });
  return data;
}

function addEvent(type, data, extraClass = "") {
  const el = document.createElement("div");
  el.className = `ev ${type} ${extraClass}`;
  el.innerHTML = `<div class="type">${type}</div><pre></pre>`;
  el.querySelector("pre").textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  $("events").appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

function showError(err) {
  addEvent("error", err.data ?? err.message, "error");
}

function setThread(view) {
  state.threadId = view.thread_id;
  $("threadId").value = view.thread_id;
  $("threadStatus").textContent = view.status;
  renderPending(view.events);
}

// The agent paused: render the question or the confirmation the last human_input_requested event asks for.
function renderPending(events) {
  const box = $("pending");
  const last = [...events].reverse().find((e) => e.type === "human_input_requested");
  const answered = last && events.slice(events.indexOf(last) + 1).some((e) => e.type === "human_input");
  if (!last || answered) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  if (last.data.kind === "confirmation") {
    box.innerHTML = `<div class="status">The agent wants to run <b>${last.data.tool}</b> with <code class="mono">${escapeHtml(JSON.stringify(last.data.arguments))}</code></div>
      <div class="row" style="margin-top:8px"><button id="approve" class="primary">Approve</button><button id="deny" class="danger">Deny</button></div>`;
    $("approve").onclick = () => humanInput({ confirm_tool_call_id: last.data.confirm_tool_call_id, approved: true });
    $("deny").onclick = () => humanInput({ confirm_tool_call_id: last.data.confirm_tool_call_id, approved: false });
  } else {
    box.innerHTML = `<div class="status">The agent asks: <b>${escapeHtml(last.data.question || "")}</b></div>
      <div class="row" style="margin-top:8px"><input id="answer" placeholder="your answer" size="40"><button id="reply" class="primary">Reply</button></div>`;
    $("reply").onclick = () => humanInput({ tool_call_id: last.data.tool_call_id, content: $("answer").value });
  }
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// POST and read the text/event-stream body frame by frame. EventSource cannot POST, so we parse it ourselves.
async function stream(path, body) {
  if (state.streaming) return;
  state.streaming = true; $("send").disabled = true;
  let assistant = null, buffer = "";
  try {
    const res = await fetch(path, { method: "POST", headers: headers(), body: JSON.stringify(body) });
    if (!res.ok) { showError({ data: await res.json().catch(() => res.statusText) }); return; }
    if (res.headers.get("X-Idempotent-Replay")) addEvent("replay", "served from the idempotency record, no model call");
    const reader = res.body.getReader(), decoder = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const frame = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
        let type = null, data = {};
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) type = line.slice(7);
          else if (line.startsWith("data: ")) { try { data = JSON.parse(line.slice(6)); } catch { data = line.slice(6); } }
        }
        if (!type) continue;
        if (type === "assistant_delta") {
          if (!assistant) assistant = addEvent("assistant_delta", "", "assistant");
          assistant.querySelector("pre").textContent += data.content ?? "";
          continue;
        }
        assistant = null;
        addEvent(type, data, type.startsWith("assistant") ? "assistant" : "");
      }
    }
  } catch (err) {
    showError(err);
  } finally {
    state.streaming = false; $("send").disabled = false;
    if (state.threadId) refreshThread().catch(showError);
  }
}

async function refreshThread() {
  const view = await api("GET", `/v1/threads/${state.threadId}`);
  setThread(view);
  return view;
}

async function humanInput(body) {
  await stream(`/v1/threads/${state.threadId}/human-input`, body);
}

$("newThread").onclick = async () => {
  try { $("events").innerHTML = ""; setThread(await api("POST", "/v1/threads", {})); } catch (e) { showError(e); }
};
$("loadThread").onclick = async () => {
  state.threadId = $("threadId").value.trim();
  try {
    $("events").innerHTML = "";
    const view = await refreshThread();
    for (const e of view.events) addEvent(e.type, e.data, e.type.startsWith("assistant") ? "assistant" : "");
  } catch (e) { showError(e); }
};
$("send").onclick = async () => {
  if (!state.threadId) { showError({ message: "create or load a thread first" }); return; }
  const content = $("content").value.trim();
  if (!content) return;
  const tools = $("allowedTools").value.trim();
  const body = { content };
  if (tools) body.allowed_tools = tools.split(",").map((s) => s.trim()).filter(Boolean);
  addEvent("user", content);
  $("content").value = "";
  await stream(`/v1/threads/${state.threadId}/messages`, body);
};
$("clear").onclick = () => { $("events").innerHTML = ""; };

function renderTable(target, rows, columns) {
  if (!rows.length) { target.innerHTML = '<p class="status">(empty)</p>'; return; }
  const head = columns.map((c) => `<th>${c}</th>`).join("");
  const body = rows.map((r) => `<tr>${columns.map((c) => `<td class="mono">${escapeHtml(String(r[c] ?? ""))}</td>`).join("")}</tr>`).join("");
  target.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function renderJson(target, data) {
  target.innerHTML = `<pre class="mono" style="white-space:pre-wrap"></pre>`;
  target.firstChild.textContent = JSON.stringify(data, null, 2);
}

$("ingest").onclick = async () => {
  try {
    const body = { doc_id: $("docId").value.trim(), text: $("docText").value, version: Number($("docVersion").value) || 1 };
    if ($("docTitle").value.trim()) body.title = $("docTitle").value.trim();
    renderJson($("knowledgeOut"), await api("POST", "/v1/documents", body));
  } catch (e) { renderJson($("knowledgeOut"), e.data ?? e.message); }
};
$("listDocs").onclick = async () => {
  try { renderTable($("knowledgeOut"), await api("GET", "/v1/documents"), ["doc_id", "version", "title"]); }
  catch (e) { renderJson($("knowledgeOut"), e.data ?? e.message); }
};
$("search").onclick = async () => {
  try {
    const q = encodeURIComponent($("q").value.trim()), k = Number($("k").value) || 5;
    renderTable($("knowledgeOut"), await api("GET", `/v1/knowledge/search?q=${q}&k=${k}`), ["citation_id", "doc_id", "section", "score", "text"]);
  } catch (e) { renderJson($("knowledgeOut"), e.data ?? e.message); }
};
$("extract").onclick = async () => {
  if (!state.threadId) { renderJson($("memoryOut"), "create or load a thread first"); return; }
  try { renderJson($("memoryOut"), await api("POST", `/v1/threads/${state.threadId}/memories`)); }
  catch (e) { renderJson($("memoryOut"), e.data ?? e.message); }
};
$("listMem").onclick = async () => {
  try {
    const rows = await api("GET", `/v1/memories?include_history=${$("withHistory").checked}`);
    renderTable($("memoryOut"), rows, Object.keys(rows[0] ?? { id: 1, content: 1 }));
  } catch (e) { renderJson($("memoryOut"), e.data ?? e.message); }
};

fetch("/healthz").then((r) => r.json()).then((h) => {
  $("health").textContent = `model=${h.model} · prompt=${h.prompt_version}`;
}).catch(() => { $("health").textContent = "/healthz unreachable"; });
</script>
</body>
</html>
